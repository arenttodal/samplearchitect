name: CI

# Runs on pull requests and on demand (no scheduled or push-to-main runs).
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - name: Unit tests (generators, parser, mapping)
        run: npm test
      - name: Rust tests
        run: npm run test:rust
      - name: Install Chromium for E2E
        run: npx playwright-core install chromium
      - name: E2E (UI journeys)
        run: npm run test:e2e
